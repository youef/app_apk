<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استيراد فيديو خاص | العز TV</title><style>body{background:#0c0d12;color:#f4f4f5;font:16px system-ui;margin:0}main{max-width:760px;margin:40px auto;padding:24px}h1{color:#f43f5e}p{line-height:1.9;color:#aaa}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;background:#1a1d27;color:white;border:1px solid #3c4151;border-radius:12px;padding:14px;font-size:15px}button,a.btn{background:#bd1233;color:white;border:0;border-radius:12px;padding:14px 20px;cursor:pointer;text-decoration:none}button:disabled{opacity:.6}pre{background:#181c27;padding:18px;border-radius:12px;white-space:pre-wrap;word-break:break-all}a{color:#fb7185}</style></head><body><main><p><a href="/studio/">العودة إلى الاستوديو</a></p><h1>استيراد فيديو خاص</h1><p>تنزيل محتوى HLS المصرّح به، وفحص مدته، ثم رفعه إلى تخزين Supabase الخاص. رابط التشغيل متاح فقط لحساب عميل يمتلك تصريح الوصول. قد تمنع حدود مساحة التخزين رفع ملفات الفيديو الكبيرة.</p><form id="f"><label>رابط M3U8</label><input id="url" required type="url" value="https://hglamioz.com/stream/xH-homnpYwMwSCPtcv2N7w/kjhhiuahiuhgihdf/1794562257/69496958/master.m3u8"><label>عنوان الفيديو</label><input id="title" required minlength="2" placeholder="اسم الفيلم أو الحلقة"><label>المدة المطلوبة بالدقائق</label><input id="minutes" type="number" min="1" max="600" value="25" required><label>معرّف حساب العميل UUID (اختياري؛ بدون تصريح لن يعمل لأي عميل)</label><input id="uid" placeholder="UUID"><p><button id="send">تنزيل وفحص ورفع الفيديو</button></p></form><pre id="status">لم يبدأ الاستيراد.</pre></main><script>const f=document.querySelector('#f'),o=document.querySelector('#status'),b=document.querySelector('#send');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;try{const data={source_url:document.querySelector('#url').value,title:document.querySelector('#title').value,min_minutes:Number(document.querySelector('#minutes').value),grant_user_id:document.querySelector('#uid').value||null};const r=await fetch('/api/private-video/import',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(JSON.stringify(x));o.textContent=JSON.stringify(x,null,2);if(x.job_id){const t=setInterval(async()=>{try{const r=await fetch('/api/private-video/jobs/'+encodeURIComponent(x.job_id),{credentials:'same-origin'});const s=await r.json();o.textContent=JSON.stringify(s,null,2);if(['ready','failed'].includes(s.status)){clearInterval(t);b.disabled=false}}catch(err){clearInterval(t);o.textContent=String(err);b.disabled=false}},5000)}}catch(err){o.textContent=String(err);b.disabled=false}});</script></body></html>
