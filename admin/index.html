<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart TV Plus | الإدارة</title><style>body{background:#0b1323;color:white;font:16px system-ui;margin:0;padding:25px}main{max-width:950px;margin:auto}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;background:#1c2b40;color:white;border:1px solid #45566a;border-radius:9px}button{background:#087b64;cursor:pointer}article{background:#16263a;border-radius:12px;padding:18px;margin:12px 0}a{color:#8de8d5}.muted{color:#aab7c8}</style><main><h1>Smart TV Plus — لوحة الإدارة</h1><p class="muted">إدارة المحتوى عبر Supabase. يتطلب النشر حسابًا مضافًا في جدول admin_users.</p><article id="login"><h2>دخول الأدمن</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="signin">تسجيل الدخول</button></article><section id="app" hidden><button id="logout">تسجيل الخروج</button><article><h2>إضافة فيلم أو مسلسل أو قناة</h2><input id="title" placeholder="عنوان المحتوى"><select id="type"><option value="movie">فيلم</option><option value="series">مسلسل</option><option value="channel">قناة</option></select><textarea id="description" placeholder="الوصف"></textarea><input id="poster" placeholder="رابط الملصق HTTPS"><input id="stream" placeholder="رابط الفيديو المباشر HTTPS"><label><input id="published" type="checkbox" style="width:auto" checked> نشر المحتوى</label><button id="save">إضافة المحتوى</button></article><h2>المكتبة</h2><div id="items"></div></section><p id="status" role="status"></p></main><script>
const BASE='https://qyzmlwtvzzgooccqxglq.supabase.co',KEY='sb_publishable_Mcev7qFw9oLWgKO7GBT8Kg_nHvaQ3ES';const $=x=>document.getElementById(x);let token=null;const msg=s=>$('status').textContent=s;
async function api(path,method='GET',body){let r=await fetch(BASE+path,{method,headers:{'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'return=representation'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.text()).slice(0,350));return r.status===204?null:r.json()}
$('signin').onclick=async()=>{try{let r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||'فشل الدخول');token=d.access_token;let admin=await api('/rest/v1/admin_users?select=user_id&limit=1');if(!admin.length)throw Error('هذا الحساب ليس أدمن');$('login').hidden=true;$('app').hidden=false;msg('تم الدخول');load()}catch(e){token=null;msg(e.message)}};
$('logout').onclick=()=>{token=null;$('login').hidden=false;$('app').hidden=true;msg('تم تسجيل الخروج')};
async function load(){try{let rows=await api('/rest/v1/catalog_items?select=id,title,type,published&order=created_at.desc');$('items').replaceChildren();rows.forEach(x=>{let a=document.createElement('article'),t=document.createElement('b'),p=document.createElement('p'),b=document.createElement('button');t.textContent=x.title;p.textContent=x.type+(x.published?' | منشور':' | مسودة');b.textContent='حذف';b.onclick=async()=>{if(!confirm('حذف المحتوى؟'))return;try{await api('/rest/v1/catalog_items?id=eq.'+encodeURIComponent(x.id),'DELETE');load()}catch(e){msg(e.message)}};a.append(t,p,b);$('items').append(a)})}catch(e){msg(e.message)}}
$('save').onclick=async()=>{let title=$('title').value.trim(),stream_url=$('stream').value.trim(),poster_url=$('poster').value.trim();if(!title||(stream_url&&!/^https:\/\//.test(stream_url))||(poster_url&&!/^https:\/\//.test(poster_url))){msg('تحقق من العنوان والروابط HTTPS');return}try{await api('/rest/v1/catalog_items','POST',{title,type:$('type').value,description:$('description').value,poster_url:poster_url||null,stream_url:stream_url||null,published:$('published').checked});msg('تم الحفظ');$('title').value='';load()}catch(e){msg(e.message)}};
</script></html>
