<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Al Ezz TV cinematic red glass backdrop">
<defs>
 <radialGradient id="base" cx="50%" cy="50%" r="82%">
  <stop stop-color="#0e080d"/><stop offset=".49" stop-color="#19030a"/><stop offset=".82" stop-color="#48010b"/><stop offset="1" stop-color="#690007"/>
 </radialGradient>
 <radialGradient id="leftGlow" cx="0%" cy="15%" r="95%">
  <stop stop-color="#bc1926" stop-opacity=".58"/><stop offset=".38" stop-color="#5a0611" stop-opacity=".15"/><stop offset="1" stop-color="#020103" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="rightGlow" cx="100%" cy="60%" r="76%">
  <stop stop-color="#ad0618" stop-opacity=".42"/><stop offset=".72" stop-color="#27000b" stop-opacity=".12"/><stop offset="1" stop-color="#040204" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="glassTop" x1="0" y1="0" x2=".8" y2="1">
  <stop stop-color="#ff3a51" stop-opacity=".29"/><stop offset=".42" stop-color="#ab1226" stop-opacity=".15"/><stop offset="1" stop-color="#10070e" stop-opacity=".15"/>
 </linearGradient>
 <linearGradient id="glassRight" x1=".1" y1="0" x2=".9" y2="1">
  <stop stop-color="#ef334a" stop-opacity=".29"/><stop offset=".66" stop-color="#ff233d" stop-opacity=".12"/><stop offset="1" stop-color="#4d0818" stop-opacity=".18"/>
 </linearGradient>
 <linearGradient id="river" x1="0" y1="0" x2="1" y2=".5">
  <stop stop-color="#4f000b" stop-opacity=".12"/><stop offset=".23" stop-color="#b91326" stop-opacity=".28"/><stop offset=".53" stop-color="#490a19" stop-opacity=".25"/><stop offset="1" stop-color="#16050b" stop-opacity=".07"/>
 </linearGradient>
 <linearGradient id="redLine" x1="0" y1="0" x2=".95" y2="0">
  <stop stop-color="#ee1731" stop-opacity=".32"/><stop offset=".20" stop-color="#fe576c" stop-opacity=".9"/><stop offset=".33" stop-color="#ffe0df"/><stop offset=".43" stop-color="#fe1d38" stop-opacity=".94"/><stop offset=".76" stop-color="#b80a25" stop-opacity=".25"/><stop offset="1" stop-color="#e72340" stop-opacity=".08"/>
 </linearGradient>
 <linearGradient id="topLine" x1="0" y1="1" x2=".95" y2="0">
  <stop stop-color="#61000c" stop-opacity=".16"/><stop offset=".40" stop-color="#c41b2f" stop-opacity=".38"/><stop offset=".78" stop-color="#ff4d66"/><stop offset=".87" stop-color="#ffe5e3"/><stop offset="1" stop-color="#f43f56"/>
 </linearGradient>
</defs>
<rect width="1920" height="1080" fill="url(#base)"/>
<rect width="1920" height="1080" fill="url(#leftGlow)"/>
<rect width="1920" height="1080" fill="url(#rightGlow)"/>
<!-- Frosted deep red, slanted glass panels. The center remains dark for menus. -->
<path d="M0 0H592L506 130Q471 203 405 220L0 285Z" fill="url(#glassTop)" stroke="#ff445e" stroke-opacity=".3" stroke-width="1.3"/>
<path d="M260 0H650L568 205Q527 315 462 346L0 402Z" fill="#0e0810" fill-opacity=".45" stroke="#e4334b" stroke-opacity=".26" stroke-width="2"/>
<path d="M0 405L335 0" stroke="#fe596b" stroke-opacity=".38" stroke-width="2"/>
<!-- Top-right luminous cinema curve -->
<path d="M1085 418Q1389 178 1920 0V66Q1510 169 1260 321Z" fill="#8f0618" fill-opacity=".23"/>
<path d="M1198 353Q1530 120 1920 65" fill="none" stroke="#9f1124" stroke-opacity=".37" stroke-width="9"/>
<path d="M1250 346Q1535 160 1920 59" fill="none" stroke="url(#topLine)" stroke-width="3.8"/>
<path d="M1565 150Q1690 83 1838 72" fill="none" stroke="#ff6575" stroke-opacity=".37" stroke-width="10"/>
<!-- Lower red translucent ribbon -->
<path d="M0 735Q286 912 552 954Q889 753 1485 743Q1713 736 1920 705V1080H0Z" fill="url(#river)"/>
<path d="M0 745Q298 939 660 965Q1040 1050 1344 992Q1550 946 1920 946" fill="none" stroke="#9f0e25" stroke-opacity=".30" stroke-width="22"/>
<path d="M0 743Q337 953 742 987Q1026 1073 1440 1023Q1656 991 1920 995" fill="none" stroke="url(#redLine)" stroke-width="3.8"/>
<path d="M152 852Q345 952 462 969" fill="none" stroke="#fc2d46" stroke-opacity=".32" stroke-width="15"/>
<!-- Right glass sheets with smooth rounded top-left silhouette -->
<path d="M1920 427L1642 512Q1562 534 1530 619L1332 1080H1920Z" fill="url(#glassRight)" stroke="#ff657c" stroke-opacity=".62" stroke-width="1.8"/>
<path d="M1920 570L1416 699Q1370 714 1351 756L1201 1080H1920Z" fill="#dc233e" fill-opacity=".16" stroke="#f0445d" stroke-opacity=".43" stroke-width="1.8"/>
<path d="M1920 571L1416 699Q1370 714 1351 756L1201 1080" fill="none" stroke="#ff7988" stroke-opacity=".64" stroke-width="2.2"/>
<path d="M1920 689Q1743 736 1612 793" fill="none" stroke="#f72a45" stroke-opacity=".24" stroke-width="10"/>
<!-- Foreground edge shadows protect overlay contrast -->
<rect width="1920" height="1080" fill="#030305" fill-opacity=".06"/>
</svg>