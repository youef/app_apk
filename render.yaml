services:
  - type: web
    name: alezz-python-studio
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: alezz-sync-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ALEZZ_PUBLIC_MODE
        value: "1"
      - key: ALEZZ_DATA_DIR
        value: /var/data
      - key: ALEZZ_SITE_PASSWORD
        sync: false
      - key: ALEZZ_SITE_SECRET
        generateValue: true
      - key: ALEZZ_AUTOSYNC_ENABLED
        value: "1"
      - key: ALEZZ_AUTOSYNC_MODE
        value: auto
      - key: ALEZZ_AUTOSYNC_INTERVAL_HOURS
        value: "0.5"
      - key: ALEZZ_AUTOSYNC_CHECK_MINUTES
        value: "5"
      - key: ALEZZ_AUTOSYNC_CONCURRENCY
        value: "5"
      - key: ALEZZ_SUPABASE_SERVICE_ROLE_KEY
        sync: false
