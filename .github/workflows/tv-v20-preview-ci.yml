name: Al Ezz TV v20.2 — Ultimate Preview

on:
  push:
    branches: [main, 'codex/ultimate-preview']
    paths:
      - '.github/workflows/tv-v20-preview-ci.yml'
      - 'app/**'
      - 'tests/**'
      - 'web/**'
      - 'python-cloud-studio/**'
      - 'scripts/verify_apk.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build separate test APK (not the stable release)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 for Android SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 33
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"
      - name: Java 11 for legacy Gradle project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'

      - name: Dynamic content and TV UI smoke tests
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          python3 -m unittest discover -s tests

      - name: Include complete brand assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          test -s web/alizz-tv-transparent.png
          cp web/alizz-tv-transparent.png app/src/main/res/drawable-nodpi/alizz_brand.png

      - name: Compile Android TV application (debug validation only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle clean testDebugUnitTest assembleDebug --no-daemon \
            -PezzApplicationId=sa.alezz.tv.preview \
            -PezzVersionCode=200200 \
            -PezzVersionName=20.2.0-preview 2>&1 | tee dist/gradle-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/al-ezz-tv-v20.2.0-ultimate-preview.apk
          export AL_EZZ_EXPECTED_PACKAGE=sa.alezz.tv.preview AL_EZZ_MIN_VERSION=200200
          python3 scripts/verify_apk.py dist/al-ezz-tv-v20.2.0-ultimate-preview.apk | tee dist/build-report.txt
          (cd dist && sha256sum al-ezz-tv-v20.2.0-ultimate-preview.apk > al-ezz-tv-v20.2.0-ultimate-preview.sha256)

      - name: Upload test APK artifact (not compatible with in-place update)
        uses: actions/upload-artifact@v4
        with:
          name: al-ezz-tv-v20.2.0-ultimate-preview
          path: |
            dist/
            app/build/test-results/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: error
