name: Check world documentary streams
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-world-documentaries.yml
      - scripts/audit_world_documentaries.py
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentary playlist
        env:
          DOCUMENTARY_PLAYLIST: https://iptv-org.github.io/iptv/categories/documentary.m3u
        run: python scripts/audit_world_documentaries.py
