name: Al Ezz TV Huidi SMART_PC822 Android 4.4 ARMv7
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/verify_apk.py'
      - 'tests/huidi-kitkat-profile-smoke.cjs'
      - '.github/workflows/android-huidi-kitkat.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: al-ezz-huidi-kitkat
  cancel-in-progress: false
jobs:
  build-huidi:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      AL_EZZ_EXPECTED_PACKAGE: sa.alezz.tv
      AL_EZZ_APK_ABI_MODE: huidi-armv7
      AL_EZZ_KEYSTORE_BASE64: ${{ secrets.AL_EZZ_KEYSTORE_BASE64 }}
      AL_EZZ_STORE_PASSWORD: ${{ secrets.AL_EZZ_STORE_PASSWORD }}
      AL_EZZ_KEY_ALIAS: ${{ secrets.AL_EZZ_KEY_ALIAS }}
      AL_EZZ_KEY_PASSWORD: ${{ secrets.AL_EZZ_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Huidi source profile
        run: node tests/huidi-kitkat-profile-smoke.cjs
      - name: Decode permanent signing keystore
        shell: bash
        run: |
          set -euo pipefail
          for key in AL_EZZ_KEYSTORE_BASE64 AL_EZZ_STORE_PASSWORD AL_EZZ_KEY_ALIAS AL_EZZ_KEY_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "::error::Signing secret $key is missing"; exit 1; }
          done
          umask 077
          printf '%s' "$AL_EZZ_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/al-ezz-huidi.jks"
          test -s "$RUNNER_TEMP/al-ezz-huidi.jks"
          echo "ORG_GRADLE_PROJECT_ezzStoreFile=$RUNNER_TEMP/al-ezz-huidi.jks" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzStorePassword=$AL_EZZ_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzKeyAlias=$AL_EZZ_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzKeyPassword=$AL_EZZ_KEY_PASSWORD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the preinstalled GitHub runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit | grep -q sdkmanager
          fi
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'
      - name: Use existing signed release version to keep upgrade compatibility
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import json,re
          j=json.load(open("data/android-update.json"))
          assert j["package_name"]=="sa.alezz.tv"
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",j["version_name"])
          print("CODE="+str(int(j["version_code"])))
          print("NAME="+j["version_name"])
          PY
          )"
          echo "ORG_GRADLE_PROJECT_ezzAbiMode=huidi-armv7" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzApplicationId=sa.alezz.tv" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzVersionCode=$CODE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzVersionName=$NAME" >> "$GITHUB_ENV"
          echo "AL_EZZ_MIN_VERSION=$CODE" >> "$GITHUB_ENV"
          echo "HUIDI_VERSION=$NAME" >> "$GITHUB_ENV"
      - name: Compile signed ARMv7 installation APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -keystore "$ORG_GRADLE_PROJECT_ezzStoreFile" -storepass "$ORG_GRADLE_PROJECT_ezzStorePassword" -alias "$ORG_GRADLE_PROJECT_ezzKeyAlias" >/dev/null
          mkdir -p app/src/main/res/drawable-nodpi dist
          cp web/alizz-tv-transparent.png app/src/main/res/drawable-nodpi/alizz_brand.png
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk dist/al-ezz-tv-huidi-android-4.4-armv7.apk
      - name: Validate APK, ARMv7 and V1 signing for API19
        run: |
          python3 scripts/verify_apk.py dist/al-ezz-tv-huidi-android-4.4-armv7.apk | tee dist/huidi-verification.txt
          sha256sum dist/al-ezz-tv-huidi-android-4.4-armv7.apk >> dist/huidi-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: al-ezz-tv-huidi-api19-${{ github.run_number }}
          path: dist/
          retention-days: 90
      - name: Publish direct APK without replacing latest stable release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "al-ezz-huidi-v${HUIDI_VERSION}-r${GITHUB_RUN_NUMBER}"             dist/al-ezz-tv-huidi-android-4.4-armv7.apk dist/huidi-verification.txt             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "العز TV — Huidi Android 4.4 ARMv7"             --notes "نسخة مخصصة لشاشة Huidi SMART_PC822: Android 4.4.4، ARMv7، توقيع V1، ذاكرة خفيفة وتحكم بالريموت. اجتازت فحوص البناء البرمجية؛ يجب تجربة التثبيت والتشغيل على الشاشة الفعلية."             --prerelease --latest=false
