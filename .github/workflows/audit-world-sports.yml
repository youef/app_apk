name: Audit worldwide sports IPTV channels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_world_sports.py
      - .github/workflows/audit-world-sports.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe sports manifests and sample reachability
        run: python scripts/audit_world_sports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-sports-stream-audit
          path: kids-global-audit.json
          if-no-files-found: ignore
          retention-days: 7
