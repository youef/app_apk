name: Al Ezz Studio – Mobile UI smoke
on:
  push:
    branches: [main]
    paths:
      - "python-cloud-studio/**"
      - ".github/workflows/studio-mobile-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse desktop and iPhone JavaScript
        run: |
          node --check python-cloud-studio/static/app.js
          node --check python-cloud-studio/static/studio-pro.js
      - name: Validate mobile interface, navigation, and PWA assets
        run: |
          python3 -m compileall -q python-cloud-studio
          python3 python-cloud-studio/test_mobile_ui.py
      - name: Verify cloud browser dependency and Docker recipe
        run: |
          grep -q '^playwright==' python-cloud-studio/requirements.txt
          grep -q 'playwright install --with-deps --only-shell chromium' Dockerfile
          grep -q 'playwright install --with-deps --only-shell chromium' python-cloud-studio/Dockerfile
      - name: Install Python API test dependencies
        run: python3 -m pip install -r python-cloud-studio/requirements.txt httpx
      - name: Verify cloud browser authorization and selection
        working-directory: python-cloud-studio
        run: |
          python3 -m unittest             test_web.DemoTest.test_cloud_browser_requires_admin_and_opt_in             test_web.DemoTest.test_cloud_browser_uses_headless_mode_after_admin_login
