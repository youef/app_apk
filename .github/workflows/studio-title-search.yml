name: Al Ezz - Title search and smart discovery checks
on:
  push:
    branches: [main]
    paths:
      - 'python-cloud-studio/smart_title_lookup.py'
      - 'python-cloud-studio/smart_discovery.py'
      - 'python-cloud-studio/smart_sync_management.py'
      - 'python-cloud-studio/test_smart_title_lookup.py'
      - 'python-cloud-studio/server.py'
      - 'python-cloud-studio/templates/index.html'
      - 'python-cloud-studio/static/title-search.js'
      - 'python-cloud-studio/static/title-search.css'
      - '.github/workflows/studio-title-search.yml'
  workflow_dispatch:
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r python-cloud-studio/requirements-dev.txt
      - name: Compile new integration modules
        run: python -m py_compile python-cloud-studio/server.py python-cloud-studio/smart_title_lookup.py python-cloud-studio/smart_sync_management.py
      - name: JavaScript title finder syntax check
        run: node --check python-cloud-studio/static/title-search.js
      - name: Verify title lookup, source feeds, and legacy queue via offline fixtures
        working-directory: python-cloud-studio
        env:
          ALEZZ_PUBLIC_MODE: '0'
          ALEZZ_AUTOSYNC_ENABLED: '0'
        run: python -m unittest test_smart_title_lookup test_smart_sync_management test_smart_discovery -v

