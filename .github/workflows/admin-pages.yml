name: Al Ezz TV - Web and Admin
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "admin/**"
      - "tests/**"
      - "supabase/functions/aseel-inspect-media/**"
      - "supabase/functions/aseel-batch-discover/**"
      - "supabase/functions/aseel-link-health/**"
      - "supabase/migrations/**"
      - ".github/workflows/admin-pages.yml"
  workflow_dispatch:

# GitHub Pages is already configured for automatic branch-based publishing.
# This workflow validates files only; a second actions/deploy-pages job
# races the built-in "pages build and deployment" job and causes HTTP 400.
permissions:
  contents: read

concurrency:
  group: al-ezz-tv-site-checks
  cancel-in-progress: true

jobs:
  validate:
    name: Validate viewer, admin and media assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript and import service tests
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/access.js
          node --check web/config.js
          node --check web/js/player.js
          node --check web/js/app.js
          node --check web/js/api.js
          node --check web/js/live.js
          node --check web/js/kids.js
          node --check web/js/cast.js
          node --check web/js/install.js
          node --check web/sw.js
          node --check admin/admin.js
          node --check admin/app.js
          node --check admin/studio.js
          node --check admin/importer.js
          node --check admin/bulk-import.js
          node --check admin/config.js
          node --check admin/series-quick.js
          node tests/series-quick-smoke.cjs
          node tests/movie-quick-smoke.cjs
          node tests/quality-picker-smoke.cjs
          node tests/universal-ui-smoke.cjs
          node tests/web-routes-smoke.cjs
          node tests/offline-playback-smoke.cjs
          node tests/kids-world-smoke.cjs
          node tests/cast-airplay-smoke.cjs
          node tests/importer-smoke.cjs
          node tests/bulk-domain-smoke.cjs
          node tests/bulk-metadata-smoke.cjs
          node tests/studio-smoke.cjs
          node tests/channel-catalog-smoke.cjs
          node tests/live-page-smoke.cjs
          node tests/live-studio-smoke.cjs
          node tests/brand-fallback-smoke.cjs
          node tests/genre-classification-smoke.cjs
          node tests/discovery-smoke.cjs
          node tests/link-health-smoke.cjs
          node tests/media-bulk-smoke.cjs
          node tests/bulk-delete-smoke.cjs
          node tests/youtube-catalog-smoke.cjs
      - name: Verify branch-published website assets
        run: |
          set -euo pipefail
          test -s index.html
          test -f .nojekyll
          test -s web/index.html
          test -s web/js/live.js
          test -s web/manifest.webmanifest
          test -s web/assets/al-ezz-app-icon.svg
          test -s web/js/player.js
          test -s web/css/live.css
          test -s web/app.js
          test -s web/styles.css
          test -s web/access.js
          test -s web/alizz-tv-transparent.png
          test -s web/al-ezz-mark.svg
          test -s admin/index.html
          test -s admin/series-quick.html
          test -s admin/series-quick.js
          test -s admin/app.js
          test -s admin/importer.js
          test -s admin/bulk-import.html
          test -s admin/bulk-import.js
          test -s admin/importer.css
          test -s web/js/legacy-polyfills.js
          test -s web/css/app-legacy.css
          test -s admin/import-studio.html
          echo "PASS: branch files are ready; native GitHub Pages will publish main:/."
      - name: Explain publishing responsibility
        run: |
          echo 'Source: repository main branch, directory /'
          echo 'This workflow intentionally does not call actions/deploy-pages.'
          echo 'GitHub Pages native "pages build and deployment" is the ONLY publisher.'
          echo 'Viewer: https://youef.github.io/app_apk/web/'
          echo 'Admin:  https://youef.github.io/app_apk/admin/'
