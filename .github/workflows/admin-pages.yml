name: Aseel TV Admin - GitHub Pages
# Run manually after Repository Settings > Pages > Source: GitHub Actions.
# GitHub App token currently lacks permission to enable Pages automatically.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: aseel-admin-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard JavaScript
        run: node --check admin/app.js
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp admin/index.html admin/style.css admin/app.js admin/config.js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
