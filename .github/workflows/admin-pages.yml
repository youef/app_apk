name: Al Ezz TV - Web and Admin
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "admin/**"
      - ".github/workflows/admin-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: al-ezz-tv-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://youef.github.io/app_apk/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/access.js
          node --check web/config.js
          node --check admin/app.js
          node --check admin/studio.js
          node --check admin/config.js
      - name: Assemble public viewer and admin dashboard
        run: |
          set -euo pipefail
          mkdir -p _site/admin
          cp web/index.html web/styles.css web/app.js web/access.js web/config.js web/al-ezz-mark.svg web/youtube-player.html _site/
          cp admin/index.html admin/style.css admin/studio.css admin/app.js admin/studio.js admin/config.js _site/admin/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/admin/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
