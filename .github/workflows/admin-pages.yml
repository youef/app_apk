name: Al Ezz TV - Web and Admin
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "admin/**"
      - "tests/**"
      - "supabase/functions/aseel-inspect-media/**"
      - ".github/workflows/admin-pages.yml"
  workflow_dispatch:

# GitHub Pages is already configured for automatic branch-based publishing.
# This workflow validates files only; a second actions/deploy-pages job
# races the built-in "pages build and deployment" job and causes HTTP 400.
permissions:
  contents: read

concurrency:
  group: al-ezz-tv-site-checks
  cancel-in-progress: true

jobs:
  validate:
    name: Validate viewer, admin and media assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript and import service tests
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/access.js
          node --check web/config.js
          node --check admin/app.js
          node --check admin/studio.js
          node --check admin/importer.js
          node --check admin/config.js
          node tests/importer-smoke.cjs
      - name: Verify branch-published website assets
        run: |
          set -euo pipefail
          test -s index.html
          test -s .nojekyll
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          test -s web/access.js
          test -s web/alizz-tv-transparent.png
          test -s web/al-ezz-mark.svg
          test -s admin/index.html
          test -s admin/app.js
          test -s admin/importer.js
          test -s admin/importer.css
          grep -q 'poster-cover' web/app.js
          grep -q 'detail-brand-logo' web/app.js
          grep -q 'aspect-ratio:2/3' web/styles.css
          echo "PASS: branch files are ready; native GitHub Pages will publish main:/."
      - name: Explain publishing responsibility
        run: |
          echo 'Source: repository main branch, directory /'
          echo 'This workflow intentionally does not call actions/deploy-pages.'
          echo 'GitHub Pages native "pages build and deployment" is the ONLY publisher.'
          echo 'Viewer: https://youef.github.io/app_apk/web/'
          echo 'Admin:  https://youef.github.io/app_apk/admin/'
