name: Audit worldwide kids IPTV candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_world_kids.py
      - .github/workflows/audit-world-kids.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public children's HLS candidate manifests only
        run: python scripts/audit_world_kids.py
      - name: Upload private-review data report (no automatic publishing)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kids-global-audit
          path: kids-global-audit.json
          if-no-files-found: ignore
          retention-days: 7
