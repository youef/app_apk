name: Al Ezz TV — Link Health Agent
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-health-agent.yml'
  workflow_dispatch:

# No long-lived credentials: authenticate using signed GitHub OIDC (v3 bootstrap).
permissions:
  contents: read
  id-token: write

concurrency:
  group: al-ezz-tv-link-health
  cancel-in-progress: false

jobs:
  scan:
    name: Check published media and update viewer visibility
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub-signed short-lived OIDC token
        id: authenticate
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=al-ezz-media-link-health")"
          token="$(jq -er .value <<< "$response")"
          echo "::add-mask::$token"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Check channels, films and episodes
        env:
          MEDIA_OIDC_TOKEN: ${{ steps.authenticate.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://qyzmlwtvzzgooccqxglq.supabase.co/functions/v1/aseel-link-health"
          response_file="$(mktemp)"
          code="$(curl --silent --show-error --max-time 180 \
            -o "$response_file" -w '%{http_code}' -X POST "$endpoint" \
            -H "Authorization: Bearer ${MEDIA_OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"per_table":10}')"
          cat "$response_file" | jq '{authenticated,scanned,healthy,suspect,broken,skipped,errors}'
          [[ "$code" == "200" ]] || { echo "::error::Link checker HTTP $code"; exit 1; }
          jq -e '(.authenticated == "github_oidc") and (.scanned > 0) and (.errors | length == 0)' "$response_file" > /dev/null
