name: Check raid35 MBC streams (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_raid35_mbc.py
      - .github/workflows/audit-raid35-mbc.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check MBC HLS and DASH manifest availability
        run: python scripts/audit_raid35_mbc.py
      - uses: actions/upload-artifact@v4
        with:
          name: mbc-link-audit
          path: mbc-link-audit.json
          retention-days: 7
