name: Al Ezz TV v20.2 — Signed Ultimate Release

on:
  workflow_dispatch:
    inputs:
      tv_upgrade_verified:
        description: 'The exact signed candidate was tested on Android TV over the previous stable APK'
        type: boolean
        default: false
      tested_apk_sha256:
        description: 'SHA-256 of the exact signed APK verified on Android TV'
        type: string

permissions:
  contents: write

concurrency:
  group: al-ezz-tv-v20-signed
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, sign, verify and release stable APK
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Java 17 for current Android SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"
      - name: Java 11 for legacy Android Gradle plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'

      - name: Require permanent release signing secrets
        shell: bash
        env:
          AL_EZZ_KEYSTORE_BASE64: ${{ secrets.AL_EZZ_KEYSTORE_BASE64 }}
          AL_EZZ_STORE_PASSWORD: ${{ secrets.AL_EZZ_STORE_PASSWORD }}
          AL_EZZ_KEY_ALIAS: ${{ secrets.AL_EZZ_KEY_ALIAS }}
          AL_EZZ_KEY_PASSWORD: ${{ secrets.AL_EZZ_KEY_PASSWORD }}
          AL_EZZ_CERT_SHA256: ${{ secrets.AL_EZZ_CERT_SHA256 }}
          AL_EZZ_PREVIOUS_VERSION_CODE: ${{ vars.AL_EZZ_PREVIOUS_VERSION_CODE }}
        run: |
          set -euo pipefail
          for key in AL_EZZ_KEYSTORE_BASE64 AL_EZZ_STORE_PASSWORD AL_EZZ_KEY_ALIAS AL_EZZ_KEY_PASSWORD AL_EZZ_CERT_SHA256; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing permanent signing secret $key. No debug APK will be published."
              exit 1
            fi
          done
          [[ "$AL_EZZ_CERT_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
          [[ "$AL_EZZ_PREVIOUS_VERSION_CODE" =~ ^[0-9]{1,9}$ ]]
          version=200200
          previous="$(python3 -c 'import json; print(int(json.load(open("data/android-update.json"))["version_code"]))')"
          if (( version <= previous || version <= 10#$AL_EZZ_PREVIOUS_VERSION_CODE )); then
            echo "::error::The candidate versionCode must exceed the deployed version and the stable feed."
            exit 1
          fi
          umask 077
          printf '%s' "$AL_EZZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/al-ezz-permanent.jks"
          keytool -list -keystore "$RUNNER_TEMP/al-ezz-permanent.jks" \
            -storepass "$AL_EZZ_STORE_PASSWORD" -alias "$AL_EZZ_KEY_ALIAS" >/dev/null
          {
            echo "ORG_GRADLE_PROJECT_ezzStoreFile=$RUNNER_TEMP/al-ezz-permanent.jks"
            echo "ORG_GRADLE_PROJECT_ezzStorePassword=$AL_EZZ_STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_ezzKeyAlias=$AL_EZZ_KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_ezzKeyPassword=$AL_EZZ_KEY_PASSWORD"
            echo "ORG_GRADLE_PROJECT_ezzApplicationId=sa.alezz.tv"
            echo "ORG_GRADLE_PROJECT_ezzVersionCode=$version"
            echo "ORG_GRADLE_PROJECT_ezzVersionName=20.2.0"
            echo "AL_EZZ_EXPECTED_PACKAGE=sa.alezz.tv"
            echo "AL_EZZ_MIN_VERSION=$version"
          } >> "$GITHUB_ENV"

      - name: Run catalog, player and remote compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          python3 -m unittest discover -s tests

      - name: Prepare release artwork
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi dist
          test -s web/alizz-tv-transparent.png
          cp web/alizz-tv-transparent.png app/src/main/res/drawable-nodpi/alizz_brand.png

      - name: Build universal Android TV release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean testDebugUnitTest assembleRelease --no-daemon > dist/gradle-build.log 2>&1 || {
            tail -150 dist/gradle-build.log
            exit 1
          }
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk dist/al-ezz-tv-v20.2.0-universal-api19.apk

      - name: Verify package, signature and universal Android compatibility
        env:
          AL_EZZ_CERT_SHA256: ${{ secrets.AL_EZZ_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_apk.py dist/al-ezz-tv-v20.2.0-universal-api19.apk | tee dist/build-report.txt
          actual="$(sed -n 's/^CERTIFICATE_SHA256=//p' dist/build-report.txt | head -1)"
          test -n "$actual"
          [[ "${actual,,}" == "${AL_EZZ_CERT_SHA256,,}" ]] || {
            echo "::error::Existing stable signing certificate mismatch, release stopped."
            exit 1
          }
          (cd dist && sha256sum al-ezz-tv-v20.2.0-universal-api19.apk > al-ezz-tv-v20.2.0.sha256)
          {
            echo "CHANNEL=stable"
            echo "VERSION=20.2.0"
            echo "VERSION_CODE=$ORG_GRADLE_PROJECT_ezzVersionCode"
            echo "PACKAGE=sa.alezz.tv"
            echo "CERTIFICATE_SHA256=$actual"
            echo "MIN_SDK=19"
            echo "COMMIT=$GITHUB_SHA"
            echo "NOTE=In-place upgrade only if previous APK used the exact same package ID and signing certificate."
          } > dist/install-metadata.txt

      - name: Upload signed APK and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: al-ezz-tv-v20.2.0-signed-universal
          path: |
            dist/al-ezz-tv-v20.2.0-universal-api19.apk
            dist/al-ezz-tv-v20.2.0.sha256
            dist/install-metadata.txt
            dist/build-report.txt
            dist/gradle-build.log
          retention-days: 90
          if-no-files-found: error

      - name: Publish immutable signed stable release
        if: inputs.tv_upgrade_verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_APK_SHA256: ${{ inputs.tested_apk_sha256 }}
        run: |
          set -euo pipefail
          built_sha="$(cut -d ' ' -f1 dist/al-ezz-tv-v20.2.0.sha256)"
          if [[ "${TESTED_APK_SHA256,,}" != "$built_sha" ]]; then
            echo "::error::The APK differs from the exact candidate verified on Android TV."
            exit 1
          fi
          tag=al-ezz-tv-v20.2.0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Stable tag already published; refuse to overwrite signed release."
            exit 1
          fi
          cat > dist/RELEASE-NOTES.md <<'NOTES'
          # العز TV v20.2.0
          - شبكات فئات للأفلام والمسلسلات والقنوات مع حفظ موضع الريموت.
          - مكتبة تتحدث من Supabase مع حفظ آخر لقطة كاملة عند انقطاع الشبكة.
          - معاينة ملاحظات الإصدار وفحص SHA-256 والحزمة والشهادة قبل فتح المثبت الرسمي.
          - APK واحد لـ Android 4.4+ (API19) على ARMv7 وARM64 وx86 وx86_64.
          NOTES
          gh release create "$tag" \
            dist/al-ezz-tv-v20.2.0-universal-api19.apk \
            dist/al-ezz-tv-v20.2.0.sha256 \
            dist/install-metadata.txt \
            dist/build-report.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "العز TV v20.2.0 Ultimate" \
            --notes-file dist/RELEASE-NOTES.md \
            --latest

      - name: Publish stable update manifest only after signed release
        if: inputs.tv_upgrade_verified
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download al-ezz-tv-v20.2.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'al-ezz-tv-v20.2.0-universal-api19.apk' --dir "$RUNNER_TEMP"
          cmp dist/al-ezz-tv-v20.2.0-universal-api19.apk "$RUNNER_TEMP/al-ezz-tv-v20.2.0-universal-api19.apk"
          git fetch origin main
          git checkout -B publish-update origin/main
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          path=pathlib.Path('dist/al-ezz-tv-v20.2.0-universal-api19.apk')
          version=int(os.environ['ORG_GRADLE_PROJECT_ezzVersionCode'])
          current=pathlib.Path('data/android-update.json')
          if version <= json.loads(current.read_text(encoding='utf-8'))['version_code']:
              raise SystemExit('Stable update feed already points to this version or a newer version.')
          manifest={
            'schema':1,
            'channel':'stable',
            'package_name':'sa.alezz.tv',
            'version_code':version,
            'version_name':'20.2.0',
            'download_url':'https://github.com/youef/app_apk/releases/download/al-ezz-tv-v20.2.0/al-ezz-tv-v20.2.0-universal-api19.apk',
            'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
            'notes':'شبكات فئات للأفلام والمسلسلات والقنوات، استعادة موضع الريموت وتحديث المكتبة من Supabase.',
            'published_at':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('data/android-update.json').write_text(
            json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "al-ezz-tv-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/android-update.json
          git commit -m "chore(release): publish signed v20.2 APK update feed [skip ci]"
          git push origin HEAD:main
