name: Aseel Film Codec Audit
on:
  push:
    branches: [main]
    paths: ['scripts/check_codecs.py', '.github/workflows/codec-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check ffprobe
        run: |
          if ! command -v ffprobe; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Probe video and audio codecs from verified media
        run: python3 scripts/check_codecs.py
      - uses: actions/upload-artifact@v4
        with:
          name: aseel-codec-audit
          path: codec-audit.json
          if-no-files-found: error
