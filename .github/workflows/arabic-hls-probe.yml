name: Arabic HLS source diagnostics — manifest only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-arabic-hls.mjs'
      - 'scripts/ffprobe-arabic-hls.mjs'
      - '.github/workflows/arabic-hls-probe.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check eight streams without rebroadcasting or claiming rights
        run: node scripts/audit-arabic-hls.mjs
      - name: Ensure ffprobe is available for codec inspection
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Probe codecs with a bounded ffprobe read (no media stored)
        run: node scripts/ffprobe-arabic-hls.mjs
      - name: Archive diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-hls-diagnostics
          path: |
            arabic-hls-audit.json
            arabic-hls-audit.md
          if-no-files-found: warn
