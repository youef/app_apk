name: Al Ezz Studio - AutoSync verification
on:
  push:
    branches: [main]
    paths:
      - 'python-cloud-studio/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/studio-autosync.yml'
  pull_request:
    paths:
      - 'python-cloud-studio/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/studio-autosync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autosync-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            python-cloud-studio/requirements.txt
            python-cloud-studio/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested dependencies
        run: python -m pip install -r python-cloud-studio/requirements-dev.txt
      - name: Check Python and administration scripts
        run: |
          python -m compileall -q python-cloud-studio
          node --check python-cloud-studio/static/app.js
          node --check python-cloud-studio/static/studio-pro.js
          node --check python-cloud-studio/static/autosync.js
      - name: Test durable tasks, media verification and cloud authentication
        working-directory: python-cloud-studio
        env:
          ALEZZ_AUTOSYNC_ENABLED: '0'
        run: python -m unittest discover -v
