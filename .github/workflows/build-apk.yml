name: Build Android 4.4.4 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'
      - name: Build debug APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-7.6/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SmartTVPlus-Android-4.4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmartTVPlus44-APK
          path: SmartTVPlus-Android-4.4.4.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Smart TV Plus $TAG" --notes "Android 4.4.4+ APK. Debug-signed test build; not a production release."
          fi
          gh release upload "$TAG" SmartTVPlus-Android-4.4.4.apk --clobber
