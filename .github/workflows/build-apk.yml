name: Build clean Android 4.4 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install legacy SDK
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"
      - name: Build and validate
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-7.6/bin/gradle clean assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump badging "$APK" > apk-badging.txt
          cat apk-badging.txt
          grep -Fq "sdkVersion:'19'" apk-badging.txt
          grep -Fq "package: name='com.aseel.tv'" apk-badging.txt
          unzip -t "$APK"
          unzip -Z1 "$APK" > apk-files.txt
          grep -Fxq "classes.dex" apk-files.txt
          "$ANDROID_HOME/build-tools/28.0.3/apksigner" verify --verbose --min-sdk-version 19 "$APK" > apk-signature.txt
          cat apk-signature.txt
          grep -Fq "Verified using v1 scheme (JAR signing): true" apk-signature.txt
          cp "$APK" Aseel-TV-Android-4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aseel-TV-Android-4.4
          path: Aseel-TV-Android-4.4.apk
      - name: Publish fresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create fresh-v1.0.0 Aseel-TV-Android-4.4.apk --target "$GITHUB_SHA" --title "Aseel TV - Fresh 1.0.0" --notes "Minimal Android 4.4.4 installation compatibility test. Offline test app."
