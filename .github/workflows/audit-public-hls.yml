name: Audit public HLS candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - scripts/audit_public_hls.py
      - .github/workflows/audit-public-hls.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe HTTPS HLS manifests (not licenses or playback)
        run: python scripts/audit_public_hls.py
      - name: Save candidate audit report
        uses: actions/upload-artifact@v4
        with:
          name: public-hls-audit
          path: stream-audit.json
          retention-days: 14
