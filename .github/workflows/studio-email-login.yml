name: Al Ezz Studio - Unified email login
on:
  push:
    branches: [main]
    paths:
      - 'python-cloud-studio/cloud_auth.py'
      - 'python-cloud-studio/server.py'
      - 'python-cloud-studio/test_cloud_auth.py'
      - '.github/workflows/studio-email-login.yml'
  workflow_dispatch:
jobs:
  auth:
    name: Offline Supabase administrator gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r python-cloud-studio/requirements-dev.txt
      - name: Check auth and server syntax
        run: python -m py_compile python-cloud-studio/cloud_auth.py python-cloud-studio/server.py
      - name: Test one-step email login, admin rejection and logout
        working-directory: python-cloud-studio
        env:
          ALEZZ_AUTOSYNC_ENABLED: '0'
        run: python -m unittest test_cloud_auth -v
