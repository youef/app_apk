name: Android TV installation and startup

on:
  push:
    branches: [main, 'codex/ultimate-preview']
    paths:
      - '.github/workflows/android-tv-install-verification.yml'
      - 'scripts/smoke_tv_install.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install the published preview on Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_APK: al-ezz-tv-v20.2.0-ultimate-preview.apk
      PREVIEW_SHA256: ad43f2db3b0713c58beffa98d4452f8f2ffac451e99ec345260976386cb7b6a0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Verify both public APK identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          sdkmanager "build-tools;33.0.2"
          cd qa
          curl -fLsS --retry 3 "https://github.com/youef/app_apk/releases/download/al-ezz-tv-v20.2.0-ultimate-preview/$PREVIEW_APK" -o "$PREVIEW_APK"
          printf '%s  %s\n' "$PREVIEW_SHA256" "$PREVIEW_APK" | sha256sum --check
          curl -fLsS --retry 3 "https://github.com/youef/app_apk/releases/download/v2.1.0/SmartTVPlus-Android-4.4.4.apk" -o previous-public.apk
          tools="$ANDROID_HOME/build-tools/33.0.2"
          {
            for apk in "$PREVIEW_APK" previous-public.apk; do
              printf '\n%s\n' "$apk"
              "$tools/aapt" dump badging "$apk" | sed -n '/^package:/p; /^sdkVersion:/p; /^targetSdkVersion:/p'
              "$tools/apksigner" verify --min-sdk-version 19 --print-certs "$apk" | sed -n '/certificate SHA-256 digest/p'
              sha256sum "$apk"
            done
          } | tee apk-identities.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and navigate the login screen with DPAD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: python3 scripts/smoke_tv_install.py "qa/$PREVIEW_APK" qa
      - name: Upload installation report and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-preview-install-verification
          path: |
            qa/*.txt
            qa/*.xml
            qa/*.png
          if-no-files-found: error
