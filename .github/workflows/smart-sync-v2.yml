name: Al Ezz Smart Sync - discovery and safe renewal
on:
  push:
    branches: [main]
    paths:
      - 'python-cloud-studio/auto_sync.py'
      - 'python-cloud-studio/smart_discovery.py'
      - 'python-cloud-studio/server.py'
      - 'python-cloud-studio/static/autosync.js'
      - 'python-cloud-studio/test_auto_sync.py'
      - 'python-cloud-studio/test_smart_discovery.py'
      - '.github/workflows/smart-sync-v2.yml'
  workflow_dispatch:
jobs:
  smart-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify legacy movie/episode extractor has not changed
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin stable/al-ezz-studio-legendary-20261103:refs/remotes/origin/stable/al-ezz-studio-legendary-20261103
          for file in python-cloud-studio/media_resolver.py python-cloud-studio/alezz_fetchv_importer.py; do
            git show "origin/stable/al-ezz-studio-legendary-20261103:${file}" > /tmp/legacy-extractor.py
            cmp -s /tmp/legacy-extractor.py "$file" || { echo "ERROR: legacy extractor modified: $file"; exit 1; }
          done
      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile python-cloud-studio/auto_sync.py python-cloud-studio/smart_discovery.py python-cloud-studio/server.py
          node --check python-cloud-studio/static/autosync.js
      - name: Install test dependencies
        run: python -m pip install -r python-cloud-studio/requirements-dev.txt
      - name: Test renewal, feed persistence, dedup and rights protection
        working-directory: python-cloud-studio
        env:
          ALEZZ_AUTOSYNC_INTERVAL_HOURS: '4'
          ALEZZ_AUTOSYNC_ENABLED: '0'
        run: python -m unittest test_auto_sync test_smart_discovery test_studio_control -v
