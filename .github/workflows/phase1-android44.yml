name: Aseel TV - Full Beta Android 4.4 Compatibility

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android19-offline-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout new clean project
        uses: actions/checkout@v4

      # New Android SDK command-line tools require Java 17 to run sdkmanager.
      # Switch back to Java 11 for AGP 7.4.2 and Gradle 7.6 afterward.
      - name: Set up Java 17 for SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v3
        with:
          # The obsolete SDK package "tools" has been removed upstream.
          packages: platform-tools

      - name: Install pinned Android SDK and Build Tools
        run: |
          sdkmanager "platforms;android-28" "build-tools;33.0.2"
          sdkmanager --list_installed

      - name: Switch to Java 11 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 7.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'

      - name: Build offline APK
        run: |
          set -o pipefail
          mkdir -p dist
          {
            echo "ASEEL TV - FULL BETA ANDROID 4.4.4"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow: ${GITHUB_RUN_ID}"
            echo "Java:"
            java -version 2>&1
            echo "Gradle:"
            gradle --version
          } | tee dist/build-report.txt
          gradle clean assembleDebug --no-daemon --stacktrace 2>&1 | tee dist/gradle-build.log

      - name: Verify APK, Manifest, DEX, ZIP, ABI and V1 signing
        run: |
          set -o pipefail
          python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk             2>&1 | tee -a dist/build-report.txt

      - name: Package validated installation test
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/aseel-tv-api19-full-beta.apk
          sha256sum dist/aseel-tv-api19-full-beta.apk | tee -a dist/build-report.txt
          echo "Device installation and playback: NOT TESTED" | tee -a dist/build-report.txt

      - name: Upload APK and validation report
        uses: actions/upload-artifact@v4
        with:
          name: aseel-tv-full-beta-api19-${{ github.run_number }}
          path: |
            dist/aseel-tv-api19-full-beta.apk
            dist/build-report.txt
            dist/gradle-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release only after validations pass
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aseel-tv-full-beta-api19
          name: Aseel TV - Full Beta Android 4.4
          prerelease: true
          make_latest: false
          body_path: docs/BETA_TEST.md
          files: dist/aseel-tv-api19-full-beta.apk
          fail_on_unmatched_files: true
