name: Al Ezz TV — Android 4.4.4 Install Fix (API 19)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: al-ezz-kitkat-install-v4
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  kitkat-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_ANDROID_PUBLIC_KEY: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 for Android SDK CLI
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 28 and Build Tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-28" "build-tools;33.0.2"
      - name: JDK 11 for Android Gradle Plugin 7.4.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Gradle 7.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'
      - name: Configure stable signing only when all protected secrets exist
        env:
          AL_EZZ_KEYSTORE_BASE64: ${{ secrets.AL_EZZ_KEYSTORE_BASE64 }}
          AL_EZZ_STORE_PASSWORD: ${{ secrets.AL_EZZ_STORE_PASSWORD }}
          AL_EZZ_KEY_ALIAS: ${{ secrets.AL_EZZ_KEY_ALIAS }}
          AL_EZZ_KEY_PASSWORD: ${{ secrets.AL_EZZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$AL_EZZ_KEYSTORE_BASE64" && -n "$AL_EZZ_STORE_PASSWORD" && -n "$AL_EZZ_KEY_ALIAS" && -n "$AL_EZZ_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$AL_EZZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/al-ezz-signing.jks"
            test -s "$RUNNER_TEMP/al-ezz-signing.jks"
            echo "ORG_GRADLE_PROJECT_ezzStoreFile=$RUNNER_TEMP/al-ezz-signing.jks" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzStorePassword=$AL_EZZ_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzKeyAlias=$AL_EZZ_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzKeyPassword=$AL_EZZ_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Stable signing secrets configured. Building release."
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::No permanent signing key configured. This build is a NEW-PACKAGE fresh-install test. Subsequent updates need GitHub signing secrets."
          fi
      - name: Build legacy-compatible APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle clean assembleDebug --no-daemon --stacktrace >dist/gradle-build.log 2>&1 || { tail -100 dist/gradle-build.log; exit 1; }
          if [[ "$SIGNING_READY" == "true" ]]; then
            gradle assembleRelease --no-daemon --stacktrace >>dist/gradle-build.log 2>&1 || { tail -100 dist/gradle-build.log; exit 1; }
            cp app/build/outputs/apk/release/app-release.apk dist/al-ezz-tv-kitkat-install-v4.apk
            echo "SIGNING_MODE=protected_permanent_release" >dist/install-metadata.txt
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/al-ezz-tv-kitkat-install-v4.apk
            echo "SIGNING_MODE=temporary_debug_fresh_install_only" >dist/install-metadata.txt
          fi
          echo "PACKAGE=sa.alezz.tv.kitkat" >>dist/install-metadata.txt
          echo "MIN_SDK=19" >>dist/install-metadata.txt
          echo "COMMIT=$GITHUB_SHA" >>dist/install-metadata.txt
          echo "Device installation still needs real hardware verification." >>dist/install-metadata.txt
      - name: "Verify installability: Android 4.4, manifest, 32-bit ABI, V1 signature"
        run: |
          set -euo pipefail
          python3 scripts/verify_apk.py dist/al-ezz-tv-kitkat-install-v4.apk | tee dist/build-report.txt
          sha256sum dist/al-ezz-tv-kitkat-install-v4.apk | tee -a dist/build-report.txt
          test -s dist/al-ezz-tv-kitkat-install-v4.apk
      - name: Upload signed installation candidate and diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: al-ezz-tv-kitkat-install-v4-${{ github.run_number }}
          path: |
            dist/al-ezz-tv-kitkat-install-v4.apk
            dist/install-metadata.txt
            dist/build-report.txt
            dist/gradle-build.log
          if-no-files-found: error
          retention-days: 30
      - name: Keep an existing release immutable across signing-key changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view al-ezz-tv-kitkat-install-v4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PUBLISH_ALLOWED=false" >> "$GITHUB_ENV"
            echo "::notice::Existing v4 APK preserved; never replace it with a differently signed CI build. The new build remains available as a workflow artifact."
          else
            echo "PUBLISH_ALLOWED=true" >> "$GITHUB_ENV"
          fi
      - name: Publish the first clean-install APK only, never replace its signature
        if: github.ref == 'refs/heads/main' && env.PUBLISH_ALLOWED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: al-ezz-tv-kitkat-install-v4
          name: Al Ezz TV v4 — Android 4.4.4 Clean Install
          prerelease: true
          make_latest: false
          body_path: docs/INSTALL_TROUBLESHOOTING_KITKAT.md
          files: |
            dist/al-ezz-tv-kitkat-install-v4.apk
            dist/install-metadata.txt
            dist/build-report.txt
          fail_on_unmatched_files: true
      - name: Upload to Appetize when linked
        if: env.APPETIZE_API_TOKEN != '' && env.APPETIZE_ANDROID_PUBLIC_KEY != ''
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
          appFile: dist/al-ezz-tv-kitkat-install-v4.apk
          platform: android
