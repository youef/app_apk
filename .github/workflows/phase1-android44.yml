name: Al Ezz TV - Android TV API19

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: al-ezz-tv-android-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android19-huidi-optimized:
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_ANDROID_PUBLIC_KEY: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout new clean project
        uses: actions/checkout@v4

      # New Android SDK command-line tools require Java 17 to run sdkmanager.
      # Switch back to Java 11 for AGP 7.4.2 and Gradle 7.6 afterward.
      - name: Set up Java 17 for SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v3
        with:
          # The obsolete SDK package "tools" has been removed upstream.
          packages: platform-tools

      - name: Install pinned Android SDK and Build Tools
        run: |
          sdkmanager "platforms;android-28" "build-tools;33.0.2"
          sdkmanager --list_installed

      - name: Switch to Java 11 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 7.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'

      - name: Build offline APK
        run: |
          set -o pipefail
          mkdir -p dist
          {
            echo "AL EZZ TV v3 - ANDROID 4.4.4"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow: ${GITHUB_RUN_ID}"
            echo "Java:"
            java -version 2>&1
            echo "Gradle:"
            gradle --version
          } | tee dist/build-report.txt
          gradle clean assembleDebug --no-daemon --stacktrace 2>&1 | tee dist/gradle-build.log

      - name: Verify APK, Manifest, DEX, ZIP, ABI and V1 signing
        run: |
          set -o pipefail
          python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk             2>&1 | tee -a dist/build-report.txt

      - name: Package validated installation test
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk dist/al-ezz-tv-android44.apk
          test -s dist/al-ezz-tv-android44.apk
          sha256sum dist/al-ezz-tv-android44.apk | tee -a dist/build-report.txt
          echo "Legacy package ID: sa.aseel.tv.cinema (branded Al Ezz TV)" | tee -a dist/build-report.txt
          echo "Distinct install ID for legacy releases; stable signing still required for subsequent upgrades." | tee -a dist/build-report.txt
          echo "Device installation and playback: NOT TESTED" | tee -a dist/build-report.txt

      - name: Enforce APK is present before artifact/release
        run: |
          set -euo pipefail
          test -s dist/al-ezz-tv-android44.apk
          python3 -c "import os; p='dist/al-ezz-tv-android44.apk'; assert os.path.getsize(p)>100000, 'Incomplete APK'"
      - name: Upload APK and validation report
        uses: actions/upload-artifact@v4
        with:
          name: al-ezz-tv-android44-${{ github.run_number }}
          path: |
            dist/al-ezz-tv-android44.apk
            dist/build-report.txt
            dist/gradle-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release only after validations pass
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: al-ezz-tv-v3-android44
          name: Al Ezz TV v3.0 - Android TV 4.4.4
          prerelease: true
          make_latest: false
          body_path: docs/AL_EZZ_TV_V3.md
          files: dist/al-ezz-tv-android44.apk
          fail_on_unmatched_files: true

      - name: Upload Android APK to Appetize if connected
        if: env.APPETIZE_API_TOKEN != '' && env.APPETIZE_ANDROID_PUBLIC_KEY != ''
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
          appFile: dist/al-ezz-tv-android44.apk
          platform: android
