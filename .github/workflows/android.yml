name: Al Ezz TV v15 — Smart Cinema Profiles & Side-by-Side Live TV (API19+)
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'web/alizz-tv-transparent.png'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
concurrency:
  group: al-ezz-redclassic-fresh-v1-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  kitkat-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_ANDROID_PUBLIC_KEY: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Java 17 for Android SDK CLI
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android API 28 and Build Tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - name: JDK 11 for Android Gradle Plugin 7.4.2
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Gradle 7.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.6'
      - name: Configure stable signing only when all protected secrets exist
        env:
          AL_EZZ_KEYSTORE_BASE64: ${{ secrets.AL_EZZ_KEYSTORE_BASE64 }}
          AL_EZZ_STORE_PASSWORD: ${{ secrets.AL_EZZ_STORE_PASSWORD }}
          AL_EZZ_KEY_ALIAS: ${{ secrets.AL_EZZ_KEY_ALIAS }}
          AL_EZZ_KEY_PASSWORD: ${{ secrets.AL_EZZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$AL_EZZ_KEYSTORE_BASE64" && -n "$AL_EZZ_STORE_PASSWORD" && -n "$AL_EZZ_KEY_ALIAS" && -n "$AL_EZZ_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$AL_EZZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/al-ezz-signing.jks"
            test -s "$RUNNER_TEMP/al-ezz-signing.jks"
            echo "ORG_GRADLE_PROJECT_ezzStoreFile=$RUNNER_TEMP/al-ezz-signing.jks" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzStorePassword=$AL_EZZ_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzKeyAlias=$AL_EZZ_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzKeyPassword=$AL_EZZ_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Stable signing secrets configured. Building release."
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::No permanent signing key configured. No stable signing key. This debug APK may require removing an installed APK signed by a different key; back up user data first."
          fi
      - name: Generate unique Android package for every build
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="sa.alezz.tv.redclassic.b${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          VERSION_CODE=$(( 10000 + GITHUB_RUN_NUMBER ))
          VERSION_NAME="15.0.0-native-${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          echo "ORG_GRADLE_PROJECT_ezzApplicationId=$PACKAGE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzVersionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzVersionName=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "AL_EZZ_EXPECTED_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "AL_EZZ_MIN_VERSION=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "AL_EZZ_RELEASE_TAG=al-ezz-v15-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "Unique install package: $PACKAGE"

      - name: Bundle official transparent brand artwork offline
        run: |
          set -euo pipefail
          test -s web/alizz-tv-transparent.png
          file web/alizz-tv-transparent.png | grep -q PNG
          mkdir -p app/src/main/res/drawable-nodpi
          cp web/alizz-tv-transparent.png app/src/main/res/drawable-nodpi/alizz_brand.png
      - name: Check native cinema structure and streaming modules
        run: |
          set -euo pipefail
          grep -q 'TVHomeActivity' app/src/main/AndroidManifest.xml
          grep -q 'CinemaPlayerActivity' app/src/main/AndroidManifest.xml
          grep -q 'aseel_episodes' app/src/main/java/sa/aseel/tv/TVHomeActivity.java
          grep -q 'aseel_channels' app/src/main/java/sa/aseel/tv/TVHomeActivity.java
          grep -q 'aseel_youtube_videos' app/src/main/java/sa/aseel/tv/TVHomeActivity.java
          grep -q 'PlaybackMemory' app/src/main/java/sa/aseel/tv/CinemaPlayerActivity.java
          test -s app/src/main/java/sa/aseel/tv/PlaybackMemory.java
          grep -q 'StreamProbe.inspect' app/src/main/java/sa/aseel/tv/CinemaPlayerActivity.java
          grep -q 'exoplayer-hls:2.18.7' app/build.gradle
          grep -q 'AL_EZZ_EXPECTED_PACKAGE' scripts/verify_apk.py
      - name: Test kids YouTube listing and playback errors
        run: |
          node tests/tv-kids-playback-smoke.cjs
          node tests/tv-remote-guide-smoke.cjs
          node tests/tv-figma-v14-smoke.cjs
          node tests/tv-smart-v15-smoke.cjs
          node tests/live-tv-v16-smoke.cjs
          node tests/live-tv-v17-genre-smoke.cjs
          node tests/live-tv-v18-balanced-smoke.cjs
          node tests/native-red-tv-focus-v21-smoke.cjs
          node tests/cinema-wallpaper-v22-smoke.cjs
          node tests/cinema-v24-profiles-and-shelves-smoke.cjs
          node tests/tv-red-glass-v25-profile-smoothness-smoke.cjs
          node tests/glossy-red-glass-buttons-v23-smoke.cjs
          node tests/member-account-login-smoke.cjs
          node tests/member-cloud-sync-smoke.cjs
          node tests/glass-v19-smoke.cjs
          node tests/red-glass-cinema-smoke.cjs
          node tests/tv-iptv-nimbus-smoke.cjs
          node tests/quality-picker-smoke.cjs
          node tests/embed-playback-smoke.cjs
          node tests/unified-sources-smoke.cjs
          node tests/kids-world-smoke.cjs
          node tests/cast-airplay-smoke.cjs
      - name: Build legacy-compatible APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle clean assembleDebug --no-daemon >dist/gradle-build.log 2>&1 || {
            echo "::error::Android build failed; showing Gradle errors and task failures"
            grep -nE "FAILURE:|What went wrong|Could not|FAILED|error:|symbol:|package .* does not exist|Execution failed|requires|AAPT:" dist/gradle-build.log | tail -80 || true
            tail -140 dist/gradle-build.log
            exit 1
          }
          if [[ "$SIGNING_READY" == "true" ]]; then
            gradle assembleRelease --no-daemon --stacktrace >>dist/gradle-build.log 2>&1 || { tail -100 dist/gradle-build.log; exit 1; }
            cp app/build/outputs/apk/release/app-release.apk dist/al-ezz-tv-v15-smart-cinema-api19.apk
            echo "SIGNING_MODE=protected_permanent_release" >dist/install-metadata.txt
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/al-ezz-tv-v15-smart-cinema-api19.apk
            echo "SIGNING_MODE=temporary_debug_fresh_install_only" >dist/install-metadata.txt
          fi
          echo "PACKAGE=$AL_EZZ_EXPECTED_PACKAGE" >>dist/install-metadata.txt
          echo "MIN_SDK=19" >>dist/install-metadata.txt
          echo "ABIS=armeabi-v7a,arm64-v8a,x86,x86_64" >>dist/install-metadata.txt
          echo "BUILD_VARIANT=UNIVERSAL" >>dist/install-metadata.txt
          echo "COMMIT=$GITHUB_SHA" >>dist/install-metadata.txt
          echo "Device installation still needs real hardware verification." >>dist/install-metadata.txt
      - name: "Verify universal ABI coverage, Android 4.4 manifest and V1 signature"
        run: |
          set -euo pipefail
          python3 scripts/verify_apk.py dist/al-ezz-tv-v15-smart-cinema-api19.apk | tee dist/build-report.txt
          sha256sum dist/al-ezz-tv-v15-smart-cinema-api19.apk | tee -a dist/build-report.txt
          test -s dist/al-ezz-tv-v15-smart-cinema-api19.apk
      - name: Upload signed installation candidate and diagnostic report
        uses: actions/upload-artifact@v6
        with:
          name: al-ezz-tv-redclassic-fresh-api19-${{ github.run_number }}
          path: |
            dist/al-ezz-tv-v15-smart-cinema-api19.apk
            dist/install-metadata.txt
            dist/build-report.txt
            dist/gradle-build.log
          if-no-files-found: error
          retention-days: 30
      - name: Publish independent playback test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release create "$AL_EZZ_RELEASE_TAG" \
            dist/al-ezz-tv-v15-smart-cinema-api19.apk \
            dist/install-metadata.txt \
            dist/build-report.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Al Ezz TV v15 - Smart Resume, Live Channel Rails & Safer Playback - $AL_EZZ_EXPECTED_PACKAGE" \
            --notes "Al Ezz TV v15 native Android TV Smart Cinema (API19+): watch history for family, kids and guest profiles without login; resume episode, elapsed position and selected quality; per-item delete and progress cleanup; remember last live channel; TV playback adds left channel rail with category filters and EPG titles only where supplied, right rail with fullscreen, next episode, quality, audio and subtitles; manual per-series intro and recap marking with skip when inside interval; bounded retry, lower-quality and authorized-source fallbacks with diagnostic reasons; 14MB/7-day disk poster cache with 2MB RAM. Source: main, Figma design https://www.figma.com/design/SVMPcH0udYPbwh5xwKDKUE. This is a test APK signed with debug when permanent signing secrets are absent; real-world stream formats, EPG availability, old-device codec support and hardware installation need testing." \
            --prerelease \
            --latest=false; then
            echo "::warning::GitHub Releases unavailable for this token; signed APK is preserved in the workflow artifact."
          fi
      # The API token must be a GitHub Actions secret. Never put it in git or logs.
      # The initial upload creates an app when no public key exists.
      - name: Determine Appetize app identifier
        id: appetize_app_key
        if: env.APPETIZE_API_TOKEN != ''
        shell: bash
        env:
          INITIAL_PUBLIC_KEY: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          key="$INITIAL_PUBLIC_KEY"
          if [[ -z "$key" && -s ".appetize/android-public-key.txt" ]]; then
            key="$(cat ".appetize/android-public-key.txt")"
          fi
          if [[ ! "$key" =~ ^[A-Za-z0-9_-]{0,128}$ ]]; then
            echo "::error::Invalid Appetize public identifier."
            exit 1
          fi
          echo "public_key=$key" >> "$GITHUB_OUTPUT"

      - name: Upload to Appetize
        id: appetize_upload
        if: env.APPETIZE_API_TOKEN != ''
        continue-on-error: true
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ steps.appetize_app_key.outputs.public_key }}
          appFile: dist/al-ezz-tv-v15-smart-cinema-api19.apk
          platform: android

      - name: Remember public Appetize app identifier for subsequent builds
        if: env.APPETIZE_API_TOKEN != '' && steps.appetize_upload.outputs.publicKey != ''
        shell: bash
        env:
          APPETIZE_PUBLIC_KEY: ${{ steps.appetize_upload.outputs.publicKey }}
        run: |
          set -euo pipefail
          # The public identifier is NOT an API credential. Validate before saving.
          if [[ ! "$APPETIZE_PUBLIC_KEY" =~ ^[A-Za-z0-9_-]{6,128}$ ]]; then
            echo "::error::Invalid public identifier returned by Appetize."
            exit 1
          fi
          mkdir -p .appetize
          printf '%s\n' "$APPETIZE_PUBLIC_KEY" > .appetize/android-public-key.txt
          git add .appetize/android-public-key.txt
          if git diff --cached --quiet; then
            echo "Appetize public identifier already saved."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(appetize): remember public app identifier for next build"
          git push origin HEAD:main

      - name: Appetize connection status
        if: env.APPETIZE_API_TOKEN == ''
        run: |
          echo "::notice::Appetize upload skipped: set APPETIZE_API_TOKEN in repository Actions secrets."
          echo "Appetize: awaiting GitHub Actions secret APPETIZE_API_TOKEN" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK for direct download after verified build
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/al-ezz-tv-v15-smart-cinema-api19.apk
          git fetch origin main
          git checkout -B direct-apk-publish origin/main
          mkdir -p downloads
          cp dist/al-ezz-tv-v15-smart-cinema-api19.apk downloads/al-ezz-tv-latest.apk
          sha256sum downloads/al-ezz-tv-latest.apk > downloads/al-ezz-tv-latest.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/al-ezz-tv-latest.apk downloads/al-ezz-tv-latest.sha256
          if git diff --cached --quiet; then
            echo "Current APK already published."
            exit 0
          fi
          git commit -m "release(android): publish Red Glass V25 APK [skip ci]"
          git push origin HEAD:main
