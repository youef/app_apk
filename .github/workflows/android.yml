name: Al Ezz TV — Red Classic Playback & Unique APK (API19+)
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'web/alizz-tv-transparent.png'
      - '.github/workflows/android.yml'
  workflow_dispatch:
concurrency:
  group: al-ezz-redclassic-fresh-v1-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  kitkat-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_ANDROID_PUBLIC_KEY: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Java 17 for Android SDK CLI
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android API 28 and Build Tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-28" "build-tools;33.0.2"
      - name: JDK 11 for Android Gradle Plugin 7.4.2
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Gradle 7.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.6'
      - name: Configure stable signing only when all protected secrets exist
        env:
          AL_EZZ_KEYSTORE_BASE64: ${{ secrets.AL_EZZ_KEYSTORE_BASE64 }}
          AL_EZZ_STORE_PASSWORD: ${{ secrets.AL_EZZ_STORE_PASSWORD }}
          AL_EZZ_KEY_ALIAS: ${{ secrets.AL_EZZ_KEY_ALIAS }}
          AL_EZZ_KEY_PASSWORD: ${{ secrets.AL_EZZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$AL_EZZ_KEYSTORE_BASE64" && -n "$AL_EZZ_STORE_PASSWORD" && -n "$AL_EZZ_KEY_ALIAS" && -n "$AL_EZZ_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$AL_EZZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/al-ezz-signing.jks"
            test -s "$RUNNER_TEMP/al-ezz-signing.jks"
            echo "ORG_GRADLE_PROJECT_ezzStoreFile=$RUNNER_TEMP/al-ezz-signing.jks" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzStorePassword=$AL_EZZ_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzKeyAlias=$AL_EZZ_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_ezzKeyPassword=$AL_EZZ_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Stable signing secrets configured. Building release."
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::No permanent signing key configured. No stable signing key. This debug APK may require removing an installed APK signed by a different key; back up user data first."
          fi
      - name: Generate unique Android package for every build
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="sa.alezz.tv.redclassic.b${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          VERSION_CODE=$(( 10000 + GITHUB_RUN_NUMBER ))
          VERSION_NAME="9.3.3-redclassic-${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          echo "ORG_GRADLE_PROJECT_ezzApplicationId=$PACKAGE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzVersionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ezzVersionName=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "AL_EZZ_EXPECTED_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "AL_EZZ_MIN_VERSION=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "AL_EZZ_RELEASE_TAG=al-ezz-playback-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "Unique install package: $PACKAGE"

      - name: Bundle official transparent brand artwork offline
        run: |
          set -euo pipefail
          test -s web/alizz-tv-transparent.png
          file web/alizz-tv-transparent.png | grep -q PNG
          mkdir -p app/src/main/res/drawable-nodpi
          cp web/alizz-tv-transparent.png app/src/main/res/drawable-nodpi/alizz_brand.png
      - name: Build legacy-compatible APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle clean assembleDebug --no-daemon --stacktrace >dist/gradle-build.log 2>&1 || { tail -100 dist/gradle-build.log; exit 1; }
          if [[ "$SIGNING_READY" == "true" ]]; then
            gradle assembleRelease --no-daemon --stacktrace >>dist/gradle-build.log 2>&1 || { tail -100 dist/gradle-build.log; exit 1; }
            cp app/build/outputs/apk/release/app-release.apk dist/al-ezz-tv-redclassic-api19-test.apk
            echo "SIGNING_MODE=protected_permanent_release" >dist/install-metadata.txt
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/al-ezz-tv-redclassic-api19-test.apk
            echo "SIGNING_MODE=temporary_debug_fresh_install_only" >dist/install-metadata.txt
          fi
          echo "PACKAGE=$AL_EZZ_EXPECTED_PACKAGE" >>dist/install-metadata.txt
          echo "MIN_SDK=19" >>dist/install-metadata.txt
          echo "ABIS=armeabi-v7a,arm64-v8a,x86,x86_64" >>dist/install-metadata.txt
          echo "BUILD_VARIANT=UNIVERSAL" >>dist/install-metadata.txt
          echo "COMMIT=$GITHUB_SHA" >>dist/install-metadata.txt
          echo "Device installation still needs real hardware verification." >>dist/install-metadata.txt
      - name: "Verify universal ABI coverage, Android 4.4 manifest and V1 signature"
        run: |
          set -euo pipefail
          python3 scripts/verify_apk.py dist/al-ezz-tv-redclassic-api19-test.apk | tee dist/build-report.txt
          sha256sum dist/al-ezz-tv-redclassic-api19-test.apk | tee -a dist/build-report.txt
          test -s dist/al-ezz-tv-redclassic-api19-test.apk
      - name: Upload signed installation candidate and diagnostic report
        uses: actions/upload-artifact@v6
        with:
          name: al-ezz-tv-redclassic-fresh-api19-${{ github.run_number }}
          path: |
            dist/al-ezz-tv-redclassic-api19-test.apk
            dist/install-metadata.txt
            dist/build-report.txt
            dist/gradle-build.log
          if-no-files-found: error
          retention-days: 30
      - name: Publish independent playback test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$AL_EZZ_RELEASE_TAG" \
            dist/al-ezz-tv-redclassic-api19-test.apk \
            dist/install-metadata.txt \
            dist/build-report.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Al Ezz TV red classic playback fix - $AL_EZZ_EXPECTED_PACKAGE" \
            --notes "Android 4.4/API19+ MP4 preference, playback diagnostics, and official YouTube fallback. New package per build installs beside older versions. TEST BUILD ONLY. Playback depends on old-device codecs, TLS and YouTube support." \
            --prerelease \
            --latest=false
      - name: Upload to Appetize when linked
        if: env.APPETIZE_API_TOKEN != '' && env.APPETIZE_ANDROID_PUBLIC_KEY != ''
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
          appFile: dist/al-ezz-tv-redclassic-api19-test.apk
          platform: android
