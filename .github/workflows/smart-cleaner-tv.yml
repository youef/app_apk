name: SMART Cleaner TV Android 4.4.4 APK
on:
  push:
    branches: [smart-pc822-cleaner]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$MANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" "platforms;android-28" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Assemble Android 4.4.4 APK
        run: gradle --no-daemon -p smartcleaner :app:assembleDebug
      - name: Verify API 19 and APK
        run: |
          test -s smartcleaner/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging smartcleaner/app/build/outputs/apk/debug/app-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: SMART-Cleaner-TV-Android-4.4.4-APK
          path: smartcleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
