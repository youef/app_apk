name: Studio Control — protected legacy engine checks

on:
  push:
    branches: [main]
    paths:
      - "python-cloud-studio/**"
      - ".github/workflows/studio-safe-control.yml"
  workflow_dispatch:

jobs:
  control:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify frozen legacy extractor blob IDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:python-cloud-studio/media_resolver.py)" = "faaf4f333612004aea9dfa3035d0d1ddbafdc3c9"
          test "$(git rev-parse HEAD:python-cloud-studio/alezz_fetchv_importer.py)" = "88cb315576893c418bef229878a6dbf29c852fb9"
          test "$(git rev-parse HEAD:python-cloud-studio/auto_sync.py)" = "d8afed58383af765c783043ad39bea399d301512"
          test "$(git rev-parse HEAD:python-cloud-studio/library_sync.py)" = "a3a56da1773251aa8decc5c186f85f67545eb6b9"
      - name: Compare original media discovery handlers by Python AST
        run: |
          python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          previous=subprocess.check_output(["git","show","f63f646a0530:python-cloud-studio/server.py"],text=True)
          current=Path("python-cloud-studio/server.py").read_text()
          keep={"discover_full","discover","discover_batch","scan_listing","verify_entries","verify","edge_capture","links"}
          def extract(text):
              tree=ast.parse(text)
              return {node.name:ast.dump(node,include_attributes=False)
                      for node in tree.body
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in keep}
          before,after=extract(previous),extract(current)
          assert before, "No original handlers found"
          assert before==after,"Legacy extraction/scan handlers were modified!"
          print("Original extraction handlers are byte-for-byte equivalent in AST.")
          PY
      - name: Check code and dashboard JS syntax
        run: |
          python -m py_compile python-cloud-studio/studio_control.py python-cloud-studio/server.py python-cloud-studio/test_studio_control.py
          node --check python-cloud-studio/static/control.js
      - name: Install Studio dependencies
        run: python -m pip install -r python-cloud-studio/requirements.txt
      - name: Run independent control-plane regression tests
        working-directory: python-cloud-studio
        run: python -m unittest -v test_studio_control
