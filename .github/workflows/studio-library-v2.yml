name: Studio Library V2 smoke checks

on:
  pull_request:
    paths:
      - "python-cloud-studio/**"
      - ".github/workflows/studio-library-v2.yml"
  push:
    branches: [main]
    paths:
      - "python-cloud-studio/**"
      - ".github/workflows/studio-library-v2.yml"

jobs:
  library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install import/test dependencies
        run: python -m pip install fastapi==0.115.14 pydantic requests beautifulsoup4
      - name: Syntax check modified Python
        run: |
          python -m py_compile \
            python-cloud-studio/library_editor.py             python-cloud-studio/instant_scan.py \
            python-cloud-studio/auto_sync.py \
            python-cloud-studio/smart_sync_management.py \
            python-cloud-studio/studio_control.py \
            python-cloud-studio/server.py
      - name: Syntax check dashboard scripts
        run: |
          node --check python-cloud-studio/static/control.js
          node --check python-cloud-studio/static/library-editor.js
      - name: Test offline library and renewal behavior
        env:
          PYTHONPATH: python-cloud-studio
        run: |
          python -m unittest discover -s python-cloud-studio/tests -p 'test_studio_library_v2.py' -v
          python -m unittest discover -s python-cloud-studio/tests -p 'test_instant_scan.py' -v
          python -m unittest discover -s python-cloud-studio/tests -p 'test_episode_scope.py' -v
