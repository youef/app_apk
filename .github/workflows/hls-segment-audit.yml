name: Aseel Real HLS Segment Audit
on:
  push:
    branches: [main]
    paths: ['scripts/check_hls_segments.py', '.github/workflows/hls-segment-audit.yml']
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify live HLS manifest, variant and segment
        run: python3 scripts/check_hls_segments.py
      - name: Upload precise HLS audit
        uses: actions/upload-artifact@v4
        with:
          name: aseel-hls-audit
          path: hls-segment-audit.json
          if-no-files-found: error
