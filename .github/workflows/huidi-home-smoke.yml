name: Huidi Home — Android 4.4 emulator screenshot and remote smoke
on:
  push:
    branches: [main]
    paths:
      - 'huidi-launcher/**'
      - '.github/workflows/huidi-home-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kitkat-emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$ROOT"
          echo "ANDROID_HOME=$ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "$ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'
      - name: Build standalone launcher debug APK
        run: gradle -p huidi-launcher assembleDebug --no-daemon
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Boot Android KitKat and capture actual launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 19
          arch: x86
          target: default
          profile: Nexus 5
          disable-animations: true
          script: |
            set -e
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install -r "$(find huidi-launcher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
            adb shell am start -n sa.youef.huidi.launcher/.MainActivity
            sleep 5
            adb shell screencap -p /data/local/tmp/huidi-home.png
            adb pull /data/local/tmp/huidi-home.png huidi-home-api19.png
            for key in 19 20 21 22 23; do adb shell input keyevent "$key"; done
            adb shell dumpsys activity activities > huidi-home-state.txt
            grep -q 'sa.youef.huidi.launcher' huidi-home-state.txt
            ! adb logcat -d -t 4000 | grep -E 'FATAL EXCEPTION.*sa.youef.huidi.launcher|Process: sa.youef.huidi.launcher'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huidi-home-api19-real-screenshot
          path: |
            huidi-home-api19.png
            huidi-home-state.txt
          if-no-files-found: ignore
          retention-days: 30
