plugins {
    id 'com.android.application'
}
android {
    namespace 'com.youef.youtubetvlegacy'
    compileSdk 33

    defaultConfig {
        applicationId 'com.youef.youtubetvlegacy'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
