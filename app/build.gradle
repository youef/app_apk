apply plugin: 'com.android.application'

android {
    namespace 'sa.aseel.tv'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'
    defaultConfig {
        applicationId (project.findProperty('ezzApplicationId') ?: 'sa.alezz.tv.redclassic.local')
        minSdkVersion 19
        targetSdkVersion 28
        // One universal APK for Android 4.4.4+, Android TV, phones and emulators.
        // The embedded Conscrypt dependency ships JNI for all four architectures.
        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }
        versionCode Integer.parseInt(project.findProperty('ezzVersionCode') ?: '19')
        versionName (project.findProperty('ezzVersionName') ?: '11.0.0-tv-local')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        ezzStable {
            // Optional stable key supplied by GitHub Actions encrypted secrets.
            // Never commit a private key, store password or build credentials.
            def keyFile = project.findProperty("ezzStoreFile")
            if (keyFile) {
                storeFile file(keyFile)
                storePassword project.findProperty("ezzStorePassword").toString()
                keyAlias project.findProperty("ezzKeyAlias").toString()
                keyPassword project.findProperty("ezzKeyPassword").toString()
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.ezzStable
        }
    }
}
dependencies {
    implementation "org.conscrypt:conscrypt-android:2.5.3"
    // Legacy ExoPlayer is retained solely because Android 4.4 requires API19.
    // Modern Media3 requires a newer OS; do not silently raise minSdk.
    implementation "com.google.android.exoplayer:exoplayer-core:2.18.7"
    implementation "com.google.android.exoplayer:exoplayer-hls:2.18.7"
    implementation "com.google.android.exoplayer:exoplayer-dash:2.18.7"
    implementation "com.google.android.exoplayer:exoplayer-ui:2.18.7"
}

tasks.register('prepareTlsRoots', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/prepare-tls-roots.sh'
}
tasks.named('preBuild') { dependsOn tasks.named('prepareTlsRoots') }
