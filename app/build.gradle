plugins { id 'com.android.application' }
android {
 namespace 'com.smarttv.plus44'
 compileSdk 33
 defaultConfig {
  applicationId 'com.smarttv.plus44.compat'
  minSdk 19
  targetSdk 22
  versionCode 5
  versionName '1.4.0'
 }
 signingConfigs {
  debug {
   enableV1Signing true
   enableV2Signing false
  }
 }
 buildTypes {
  debug {
   signingConfig signingConfigs.debug
   minifyEnabled false
  }
 }
}
