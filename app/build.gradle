apply plugin: 'com.android.application'

android {
    namespace 'sa.aseel.tv'
    compileSdkVersion 28
    buildToolsVersion '33.0.2'
    defaultConfig {
        applicationId 'sa.aseel.tv.kitkatfix'
        minSdkVersion 19
        targetSdkVersion 28
        ndk { abiFilters "armeabi-v7a" }
        versionCode 1
        versionName '1.4.0-install-repair'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        aseelStable {
            // Supplied ONLY by protected CI secrets; never checked into Git.
            def storePath = project.findProperty("aseelStoreFile")
            if (storePath) {
                storeFile file(storePath)
                storePassword project.property("aseelStorePassword").toString()
                keyAlias project.property("aseelKeyAlias").toString()
                keyPassword project.property("aseelKeyPassword").toString()
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.aseelStable
        }
    }
}
dependencies {
    implementation "org.conscrypt:conscrypt-android:2.5.3"
}

tasks.register('prepareTlsRoots', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/prepare-tls-roots.sh'
}
tasks.named('preBuild') { dependsOn tasks.named('prepareTlsRoots') }
