apply plugin: 'com.android.application'

android {
    namespace 'sa.aseel.tv'
    compileSdkVersion 28
    buildToolsVersion '33.0.2'
    defaultConfig {
        applicationId 'sa.aseel.tv'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 5
        versionName '1.1.0-catalog'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        aseelStable {
            // Supplied ONLY by protected CI secrets; never checked into Git.
            def storePath = project.findProperty("aseelStoreFile")
            if (storePath) {
                storeFile file(storePath)
                storePassword project.property("aseelStorePassword").toString()
                keyAlias project.property("aseelKeyAlias").toString()
                keyPassword project.property("aseelKeyPassword").toString()
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.aseelStable
        }
    }
}
dependencies {
    // Native framework only; compatible with low-memory Android 4.4.4 devices.
}
