apply plugin: 'com.android.application'

android {
    namespace 'sa.aseel.tv'
    compileSdkVersion 28
    buildToolsVersion '33.0.2'
    defaultConfig {
        applicationId 'sa.alezz.tv.remote'
        minSdkVersion 19
        targetSdkVersion 28
        ndk { abiFilters "armeabi-v7a" }
        versionCode 5
        versionName '5.0.0-tv-remote'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        ezzStable {
            // Optional stable key supplied by GitHub Actions encrypted secrets.
            // Never commit a private key, store password or build credentials.
            def keyFile = project.findProperty("ezzStoreFile")
            if (keyFile) {
                storeFile file(keyFile)
                storePassword project.findProperty("ezzStorePassword").toString()
                keyAlias project.findProperty("ezzKeyAlias").toString()
                keyPassword project.findProperty("ezzKeyPassword").toString()
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.ezzStable
        }
    }
}
dependencies {
    implementation "org.conscrypt:conscrypt-android:2.5.3"
}

tasks.register('prepareTlsRoots', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/prepare-tls-roots.sh'
}
tasks.named('preBuild') { dependsOn tasks.named('prepareTlsRoots') }
