plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("KEYSTORE_FILE")
def hasReleaseKeystore = keystorePath != null && !keystorePath.trim().isEmpty()

android {
    namespace "sa.aseel.tv"
    compileSdk 34

    defaultConfig {
        applicationId "sa.alezz.tv.unified"
        minSdk 19
        targetSdk 34
        versionCode 16
        versionName "10.0.0"
    }

    signingConfigs {
        release {
            // Only configure a real release key when CI provides one. Otherwise the
            // release variant falls back to the debug key and is still installable.
            if (hasReleaseKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// The website is the single source of truth for the UI. Copying it into assets
// keeps the APK and the hosted site on exactly the same release.
def webSourceDir = rootProject.file("web")
def webAssetsDir = file("src/main/assets/web")

tasks.register("syncWebAssets", Copy) {
    description = "Bundle the shared web app into app/src/main/assets/web."
    group = "build"
    from(webSourceDir) {
        // Diagnostics/test pages must never ship inside the APK.
        exclude "**/__*.html"
        exclude "__*.html"
    }
    into webAssetsDir
}

preBuild.dependsOn syncWebAssets

dependencies {
}
