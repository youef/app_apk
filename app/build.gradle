apply plugin: 'com.android.application'

android {
    namespace 'sa.aseel.tv'
    compileSdkVersion 28
    buildToolsVersion '33.0.2'
    defaultConfig {
        applicationId 'sa.aseel.tv'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 2
        versionName '0.9.0-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
}
dependencies {
    // Native framework only; compatible with low-memory Android 4.4.4 devices.
}
